<svg xmlns="http://www.w3.org/2000/svg" width="900" height="270" viewBox="0 0 900 270" role="img" aria-label="Hi, I'm frapalozz – MSc student in Computer Science, with a pixel kitten chasing a ball of yarn">
  <style>
    :root { --bg1:#fff7ed; --bg2:#fdf2f8; --fg:#1f2328; --muted:#57606a; --acc:#ec4899; --acc2:#f59e0b; --line:#e5d5c5; --spark:#f59e0b; }
    @media (prefers-color-scheme: dark) {
      :root { --bg1:#0d1117; --bg2:#1c1428; --fg:#e6edf3; --muted:#9aa4af; --acc:#f472b6; --acc2:#fbbf24; --line:#3a2f45; --spark:#fde68a; }
    }
    .title { font: 800 40px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--fg); }
    .sub   { font: 400 20px ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; fill: var(--muted); }
    .acc   { fill: var(--acc); }
    .spark { fill: var(--spark); opacity: 0; }
    .card  { stroke: var(--line); }
    .floor { stroke: var(--line); stroke-width: 4; stroke-dasharray: 8 8; }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" style="stop-color:var(--bg1)"/><stop offset="1" style="stop-color:var(--bg2)"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" x2="1">
      <stop offset="0" style="stop-color:var(--acc)"/><stop offset="1" style="stop-color:var(--acc2)"/>
    </linearGradient>
    <clipPath id="cardclip"><rect x="1" y="1" width="898" height="268" rx="16"/></clipPath>
    <clipPath id="c0"><rect x="60" y="122" height="36" width="0"><animate attributeName="width" values="0;468;468;0;0" keyTimes="0.000;0.100;0.220;0.250;1" dur="16s" repeatCount="indefinite"/></rect></clipPath><clipPath id="c1"><rect x="60" y="122" height="36" width="0"><animate attributeName="width" values="0;0;348;348;0;0" keyTimes="0;0.250;0.350;0.470;0.500;1" dur="16s" repeatCount="indefinite"/></rect></clipPath><clipPath id="c2"><rect x="60" y="122" height="36" width="0"><animate attributeName="width" values="0;0;396;396;0;0" keyTimes="0;0.500;0.600;0.720;0.750;1" dur="16s" repeatCount="indefinite"/></rect></clipPath><clipPath id="c3"><rect x="60" y="122" height="36" width="0"><animate attributeName="width" values="0;0;432;432;0" keyTimes="0;0.750;0.850;0.970;1.000" dur="16s" repeatCount="indefinite"/></rect></clipPath>
  </defs>

  <rect class="card" x="1" y="1" width="898" height="268" rx="16" fill="url(#bg)"/>
  <g transform="translate(640 40)" class="spark"><rect x="-2" y="-8" width="4" height="16"/><rect x="-8" y="-2" width="16" height="4"/><animate attributeName="opacity" values="0;1;0" dur="2.2s" begin="0s" repeatCount="indefinite"/></g><g transform="translate(820 70)" class="spark"><rect x="-2" y="-8" width="4" height="16"/><rect x="-8" y="-2" width="16" height="4"/><animate attributeName="opacity" values="0;1;0" dur="3.1s" begin="0.7s" repeatCount="indefinite"/></g><g transform="translate(720 120)" class="spark"><rect x="-2" y="-8" width="4" height="16"/><rect x="-8" y="-2" width="16" height="4"/><animate attributeName="opacity" values="0;1;0" dur="2.6s" begin="1.3s" repeatCount="indefinite"/></g><g transform="translate(860 140)" class="spark"><rect x="-2" y="-8" width="4" height="16"/><rect x="-8" y="-2" width="16" height="4"/><animate attributeName="opacity" values="0;1;0" dur="1.9s" begin="0.4s" repeatCount="indefinite"/></g><g transform="translate(560 30)" class="spark"><rect x="-2" y="-8" width="4" height="16"/><rect x="-8" y="-2" width="16" height="4"/><animate attributeName="opacity" values="0;1;0" dur="2.8s" begin="1.9s" repeatCount="indefinite"/></g><g transform="translate(780 30)" class="spark"><rect x="-2" y="-8" width="4" height="16"/><rect x="-8" y="-2" width="16" height="4"/><animate attributeName="opacity" values="0;1;0" dur="2.4s" begin="1.1s" repeatCount="indefinite"/></g>

  <text class="title" x="60" y="92">Hi, I'm frapalozz</text>
  <text x="392" y="90" font-size="38">👋<animateTransform attributeName="transform" type="rotate" values="0 412 78;18 412 78;-8 412 78;18 412 78;0 412 78;0 412 78" keyTimes="0;.1;.2;.3;.4;1" dur="2.5s" repeatCount="indefinite"/></text>
  <rect x="60" y="106" height="4" rx="2" fill="url(#bar)" width="0"><animate attributeName="width" values="0;180" dur="1.2s" fill="freeze"/></rect>

  <text class="sub" x="60" y="148" clip-path="url(#c0)" textLength="468" lengthAdjust="spacingAndGlyphs">&gt; MSc in Computer Science (send coffee)</text><text class="sub" x="60" y="148" clip-path="url(#c1)" textLength="348" lengthAdjust="spacingAndGlyphs">&gt; folding RNA, unfolding bugs</text><text class="sub" x="60" y="148" clip-path="url(#c2)" textLength="396" lengthAdjust="spacingAndGlyphs">&gt; it works on my machine. mostly.</text><text class="sub" x="60" y="148" clip-path="url(#c3)" textLength="432" lengthAdjust="spacingAndGlyphs">&gt; my cat is the senior code reviewer</text>
  <rect class="acc" y="131" width="10" height="22" x="62">
    <animate attributeName="x" values="62;530;530;62;62;410;410;62;62;458;458;62;62;494;494;62;62" keyTimes="0;0.100;0.220;0.246;0.250;0.350;0.470;0.496;0.500;0.600;0.720;0.746;0.750;0.850;0.970;0.996;1" dur="16s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.5;.5;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <line class="floor" x1="20" y1="252" x2="880" y2="252"/>

